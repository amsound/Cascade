[package]
name = "cascade-relay"
version = "0.1.0"
edition = "2021"
description = "Cascade cloud relay — NAT traversal and name-based discovery"

[[bin]]
name = "cascade-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
